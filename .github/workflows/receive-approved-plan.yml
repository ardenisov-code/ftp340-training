name: Publish TriCoach-approved plan

on:
  repository_dispatch:
    types: [tricoach_plan_approved]

concurrency:
  group: ftp340-approved-plan-publication
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Authenticate event
        id: auth
        env:
          TRICOACH_DISPATCH_HMAC_SECRET: ${{ secrets.TRICOACH_DISPATCH_HMAC_SECRET }}
        run: python scripts/publish_plan.py authorize --event-file "$GITHUB_EVENT_PATH"
      - name: Stage approved plan
        id: prepare
        env:
          TRICOACH_DISPATCH_HMAC_SECRET: ${{ secrets.TRICOACH_DISPATCH_HMAC_SECRET }}
        run: python scripts/publish_plan.py prepare --event-file "$GITHUB_EVENT_PATH" --repo .
      - name: Save approved version
        id: commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add adaptive-plan.json .ftp340-sync-state.json versions/
          if git diff --cached --quiet; then
            echo 'pushed=false' >> "$GITHUB_OUTPUT"
          else
            git commit -m "Publish TriCoach-approved FTP340 plan v${{ steps.prepare.outputs.version_number }}"
            git push origin HEAD:main
            echo 'pushed=true' >> "$GITHUB_OUTPUT"
          fi
          echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Build approved Pages artifact
        run: python scripts/build_pages.py --output /tmp/ftp340-pages --mode adaptive
      - name: Upload approved Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          name: ftp340-approved-pages
          path: /tmp/ftp340-pages
      - name: Deploy approved Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: ftp340-approved-pages
      - name: Verify exact public version and hash
        id: verify
        run: >-
          python scripts/verify_publication.py
          --url "https://ardenisov-code.github.io/ftp340-training/adaptive-plan.json?run=${GITHUB_RUN_ID}"
          --version "${{ steps.prepare.outputs.version_number }}"
          --sha256 "${{ steps.prepare.outputs.manifest_sha256 }}"
          --attempts 18 --delay 5
      - name: Restore previous repository pointer
        id: rollback
        if: always() && steps.commit.outputs.pushed == 'true' && steps.verify.outcome != 'success'
        run: |
          if git cat-file -e '${{ steps.commit.outputs.commit_sha }}^:adaptive-plan.json' 2>/dev/null; then
            git show '${{ steps.commit.outputs.commit_sha }}^:adaptive-plan.json' > adaptive-plan.json
            git add adaptive-plan.json
          else
            git rm -f adaptive-plan.json
          fi
          git show '${{ steps.commit.outputs.commit_sha }}^:.ftp340-sync-state.json' > .ftp340-sync-state.json
          git add .ftp340-sync-state.json
          git commit -m 'Restore previous public FTP340 plan after failed verification'
          git push origin HEAD:main
          echo "rollback_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Build previous Pages artifact
        id: rollback_build
        if: always() && steps.rollback.outcome == 'success'
        run: |
          if [[ '${{ steps.prepare.outputs.previous_version }}' == '0' ]]; then mode=legacy; else mode=adaptive; fi
          python scripts/build_pages.py --output /tmp/ftp340-rollback --mode "$mode"
      - name: Upload previous Pages artifact
        id: rollback_upload
        if: always() && steps.rollback_build.outcome == 'success'
        uses: actions/upload-pages-artifact@v4
        with:
          name: ftp340-rollback-pages
          path: /tmp/ftp340-rollback
      - name: Redeploy previous Pages artifact
        id: rollback_deploy
        if: always() && steps.rollback_upload.outcome == 'success'
        uses: actions/deploy-pages@v4
        with:
          artifact_name: ftp340-rollback-pages
      - name: Verify previous approved version
        id: verify_rollback
        if: always() && steps.rollback_deploy.outcome == 'success' && steps.prepare.outputs.previous_version != '0'
        run: >-
          python scripts/verify_publication.py
          --url "https://ardenisov-code.github.io/ftp340-training/adaptive-plan.json?rollback=${GITHUB_RUN_ID}"
          --version "${{ steps.prepare.outputs.previous_version }}"
          --sha256 "${{ steps.prepare.outputs.previous_sha256 }}"
          --attempts 18 --delay 5
      - name: Verify legacy page restoration
        id: verify_legacy_rollback
        if: always() && steps.rollback_deploy.outcome == 'success' && steps.prepare.outputs.previous_version == '0'
        run: >-
          python scripts/verify_publication.py
          --url "https://ardenisov-code.github.io/ftp340-training/?rollback=${GITHUB_RUN_ID}"
          --raw-sha256 "$(sha256sum index.html | cut -d' ' -f1)" --attempts 18 --delay 5
      - name: Report result to TriCoach
        if: always() && steps.auth.outcome == 'success'
        env:
          LINK_SIGNING_SECRET: ${{ secrets.LINK_SIGNING_SECRET }}
          TRICOACH_CALLBACK_URL: ${{ secrets.TRICOACH_CALLBACK_URL }}
        run: |
          if [[ '${{ steps.verify.outcome }}' == 'success' ]]; then
            status=published; commit='${{ steps.commit.outputs.commit_sha }}'; error=''
          else
            status=failed; commit='${{ steps.rollback.outputs.rollback_sha }}'; error=publication_or_pages_verification_failed
            if [[ '${{ steps.commit.outputs.pushed }}' == 'true' && '${{ steps.verify_rollback.outcome }}' != 'success' && '${{ steps.verify_legacy_rollback.outcome }}' != 'success' ]]; then
              error=rollback_not_verified
            fi
          fi
          python scripts/send_publish_result.py --status "$status" \
            --proposal-id '${{ steps.auth.outputs.proposal_id }}' \
            --version '${{ steps.auth.outputs.version_number }}' \
            --version-id '${{ steps.auth.outputs.version_id }}' \
            --commit-sha "$commit" --manifest-sha256 '${{ steps.prepare.outputs.manifest_sha256 }}' --error-code "$error"
