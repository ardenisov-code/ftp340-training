name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run Test Suite
        run: python -m unittest discover tests

      - name: Validate Plan Integrity and Sync State
        id: validate
        run: python scripts/validate_deployment.py

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build Pages Artifact
        run: python scripts/build_pages.py --output /tmp/ftp340-pages --mode adaptive

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: /tmp/ftp340-pages

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify Live Published Version and Hash
        if: steps.validate.outputs.version_number != ''
        run: >-
          python scripts/verify_publication.py
          --url "https://ardenisov-code.github.io/ftp340-training/adaptive-plan.json?run=${GITHUB_RUN_ID}"
          --version "${{ steps.validate.outputs.version_number }}"
          --sha256 "${{ steps.validate.outputs.manifest_sha256 }}"
          --attempts 18 --delay 5
